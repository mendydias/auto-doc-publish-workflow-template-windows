abstract: >-
  This illustrative paper demonstrates a repository-rooted, YAML-driven publishing
  workflow for IEEE conference manuscripts. It shows how ordered Markdown sources,
  structured metadata, bibliography processing, and venue checks can be combined
  while leaving publication typography to the IEEEtran class.
