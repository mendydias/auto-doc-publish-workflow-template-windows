[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-academic-publisher"
version = "0.1.0"
description = "Windows-native academic Markdown publishing workflow"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2", "bibtexparser==1.4.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.7", "pymarkdownlnt==0.9.29", "pypdf==5.3.1"]

[project.scripts]
academic-publish = "tools.publishing.__main__:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
