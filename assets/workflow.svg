<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" role="img" aria-labelledby="title">
  <title id="title">Ordered Markdown sources become academic publications</title>
  <rect x="10" y="20" width="180" height="80" rx="8" fill="#e8eef8" stroke="#284b7a"/>
  <text x="100" y="66" text-anchor="middle" font-family="sans-serif" font-size="18">Markdown sources</text>
  <path d="M200 60h70" stroke="#284b7a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="280" y="20" width="160" height="80" rx="8" fill="#edf6ed" stroke="#326b3e"/>
  <text x="360" y="66" text-anchor="middle" font-family="sans-serif" font-size="18">Pandoc</text>
  <path d="M450 60h55" stroke="#284b7a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="555" y="48" text-anchor="middle" font-family="sans-serif" font-size="15">PDF · DOCX</text>
  <text x="555" y="74" text-anchor="middle" font-family="sans-serif" font-size="15">HTML · EPUB</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#284b7a"/></marker></defs>
</svg>
