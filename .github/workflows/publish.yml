name: Windows publishing

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      document:
        description: Manifest name
        required: true
        default: example
      profile:
        type: choice
        options: [article, report, thesis]
        default: article
      typography:
        type: choice
        options: [default, academic, compact]
        default: academic
      format:
        type: choice
        options: [pdf, latex, docx, html, epub, all]
        default: all

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - document: example
            profile: article
            format: pdf
          - document: example
            profile: article
            format: docx
          - document: thesis
            profile: thesis
            format: pdf
          - document: thesis
            profile: thesis
            format: docx
          - document: example
            profile: article
            format: all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify required native toolchain
        shell: pwsh
        run: ./scripts/check-deps.ps1 -Format all
      - name: Record native toolchain versions
        shell: pwsh
        run: |
          pandoc --version | Select-Object -First 2
          pandoc-crossref --version
          lualatex --version | Select-Object -First 2
          latexmk -v | Select-Object -First 1
          perl --version | Select-Object -First 2
      - name: Unit tests and lint
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ./publish.ps1 -Action Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./publish.ps1 -Action Lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build publication
        shell: pwsh
        env:
          DOC: ${{ github.event.inputs.document || matrix.document }}
          PROFILE: ${{ github.event.inputs.profile || matrix.profile }}
          TYPOGRAPHY: ${{ github.event.inputs.typography || 'academic' }}
          FORMAT: ${{ github.event.inputs.format || matrix.format }}
        run: ./publish.ps1 -Action Build -Document $env:DOC -Profile $env:PROFILE -Typography $env:TYPOGRAPHY -Format $env:FORMAT
      - name: Upload publications and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publications-${{ strategy.job-index }}
          path: build/
          if-no-files-found: warn
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -e .
      - name: Verify release toolchain and build all formats
        shell: pwsh
        run: |
          ./scripts/check-deps.ps1 -Format all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./publish.ps1 -Action Build -Document example -Profile article -Typography academic -Format all
      - name: Publish successful release artifacts
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.1
        with:
          files: build/**
