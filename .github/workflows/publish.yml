name: Windows publishing

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      document:
        description: Document folder name
        required: true
        default: example
      template:
        type: choice
        options: [article, report, thesis, ieee-conference]
        default: article
      typography:
        type: choice
        options: [default, academic, compact]
        default: academic
      format:
        type: choice
        options: [pdf, latex, docx, html, epub, all]
        default: all

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - document: example
            profile: article
            format: pdf
          - document: example
            profile: article
            format: docx
          - document: thesis
            profile: thesis
            format: pdf
          - document: thesis
            profile: thesis
            format: docx
          - document: example
            profile: article
            format: all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision publishing tools
        shell: powershell
        run: .\setup.ps1 -NonInteractive -AcceptAgreements
      - name: Verify required native toolchain
        shell: pwsh
        run: ./publish.ps1 -Action Check -Format $env:FORMAT
        env:
          FORMAT: ${{ matrix.format }}
      - name: Record native toolchain versions
        shell: pwsh
        run: |
          pandoc --version | Select-Object -First 2
          pandoc-crossref --version
          lualatex --version | Select-Object -First 2
          latexmk -v | Select-Object -First 1
          perl --version | Select-Object -First 2
      - name: Unit tests and lint
        if: github.event_name == 'pull_request' && matrix.document == 'example' && matrix.profile == 'article' && matrix.format == 'pdf'
        shell: pwsh
        run: |
          ./publish.ps1 -Action Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./publish.ps1 -Action Lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build publication
        if: >-
          (github.event_name == 'pull_request' && matrix.format != 'all') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.format == 'all') ||
          (startsWith(github.ref, 'refs/tags/v') && matrix.format == 'all') ||
          (github.event_name == 'workflow_dispatch' && matrix.document == 'example' && matrix.profile == 'article' && matrix.format == 'pdf')
        shell: pwsh
        env:
          DOC: ${{ github.event.inputs.document || matrix.document }}
          PUBLISH_DOCUMENT: ${{ github.event.inputs.document || matrix.document }}
          PUBLISH_TEMPLATE: ${{ github.event.inputs.template || matrix.profile }}
          PUBLISH_TYPOGRAPHY: ${{ github.event.inputs.typography || 'academic' }}
          PUBLISH_FORMAT: ${{ github.event.inputs.format || matrix.format }}
          PUBLISH_NON_INTERACTIVE: '1'
        run: ./publish.ps1
      - name: Upload publications and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publications-${{ strategy.job-index }}
          path: build/
          if-no-files-found: warn
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision publishing tools
        shell: powershell
        run: .\setup.ps1 -NonInteractive -AcceptAgreements
      - name: Verify release toolchain and build all formats
        shell: pwsh
        run: |
          ./publish.ps1 -Action Check -Format all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PUBLISH_DOCUMENT = 'example'
          $env:PUBLISH_TEMPLATE = 'article'
          $env:PUBLISH_TYPOGRAPHY = 'academic'
          $env:PUBLISH_FORMAT = 'all'
          $env:PUBLISH_NON_INTERACTIVE = '1'
          ./publish.ps1
      - name: Publish successful release artifacts
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.1
        with:
          files: build/**
